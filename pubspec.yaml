name: mock_analysis_android
description: Local-first mock test analysis app for competitive exams.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  drift: ^2.21.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  share_plus: ^7.2.2
  uuid: ^4.5.1
  intl: ^0.19.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
